  <!-- Petals -->
  <ellipse cx="32" cy="22" rx="5" ry="12" fill="#c9b8d4" opacity="0.9"/>
  <ellipse cx="32" cy="22" rx="5" ry="12" fill="#c9b8d4" opacity="0.9" transform="rotate(60 32 32)"/>
  <ellipse cx="32" cy="22" rx="5" ry="12" fill="#c9b8d4" opacity="0.9" transform="rotate(120 32 32)"/>
  <ellipse cx="32" cy="22" rx="5" ry="12" fill="#a890b8" opacity="0.7" transform="rotate(30 32 32)"/>
  <ellipse cx="32" cy="22" rx="5" ry="12" fill="#a890b8" opacity="0.7" transform="rotate(90 32 32)"/>
  <ellipse cx="32" cy="22" rx="5" ry="12" fill="#a890b8" opacity="0.7" transform="rotate(150 32 32)"/>
